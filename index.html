<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перевод минут в часы и десятичные доли онлайн — быстрый калькулятор</title>
    <meta name="description" content="Удобный онлайн-калькулятор для быстрого перевода минут в часы и минуты (ч, мин), а также в десятичный формат (например, 90 мин = 1.5 ч). Быстрое копирование результата в один клик.">
    <meta name="keywords" content="перевод минут в часы, минуты в часы, калькулятор минут в часы, перевести минуты в десятичные часы, расчет рабочего времени, сколько часов в минутах">

    <!-- OpenGraph для красивых ссылок в мессенджерах -->
    <meta property="og:title" content="Калькулятор перевода минут в часы онлайн">
    <meta property="og:description" content="Мгновенный перевод минут в формат «ч мин» и десятичные часы с копированием в один клик.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cte17a.github.io/min2hour/">
    <meta property="og:site_name" content="min2hour">
    
    <meta property="og:image" content="https://cte17a.github.io/min2hour/">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="app">
    <div class="display-card">
        <div>
            <div class="input-header">
                <span>Ввод минут</span>
                <span id="digitCount">0 цифр</span>
            </div>
            <div class="input-wrapper" id="inputWrapper">
                <div class="input-display placeholder" id="inputDisplay">0</div>
            </div>
        </div>

        <div>
            <div class="divider"></div>
            <div class="results">
                <div class="res-item" onclick="copyResult('mainRes', 'badgeMain')">
                    <div class="res-text-wrap">
                        <span class="res-main-text" id="mainRes">0 ч 00 мин</span>
                    </div>
                    <span class="copy-badge" id="badgeMain">Копировать</span>
                </div>
                <div class="res-item" onclick="copyResult('decRes', 'badgeDec')">
                    <div class="res-text-wrap">
                        <span class="res-dec-text" id="decRes">0 ч</span>
                    </div>
                    <span class="copy-badge" id="badgeDec">Копировать</span>
                </div>
            </div>
        </div>
    </div>

    <div class="quick-bar">
        <button class="q-btn" onclick="addMinutes(15)">+15</button>
        <button class="q-btn" onclick="addMinutes(30)">+30</button>
        <button class="q-btn" onclick="addMinutes(45)">+45</button>
        <button class="q-btn" onclick="addMinutes(60)">+60</button>
    </div>

    <div class="keypad">
        <button class="key" onclick="pressDigit('7')">7</button>
        <button class="key" onclick="pressDigit('8')">8</button>
        <button class="key" onclick="pressDigit('9')">9</button>

        <button class="key" onclick="pressDigit('4')">4</button>
        <button class="key" onclick="pressDigit('5')">5</button>
        <button class="key" onclick="pressDigit('6')">6</button>

        <button class="key" onclick="pressDigit('1')">1</button>
        <button class="key" onclick="pressDigit('2')">2</button>
        <button class="key" onclick="pressDigit('3')">3</button>

        <button class="key action-clear" onclick="clearAll()">C</button>
        <button class="key" onclick="pressDigit('0')">0</button>
        <button class="key" onclick="pressDot()">,</button>
    </div>
    
    <button class="key action-back" onclick="backspace()">⌫ Стереть</button>
</div>
